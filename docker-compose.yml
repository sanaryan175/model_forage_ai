services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modelforge}
      POSTGRES_DB: ${POSTGRES_DB:-modelforge}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_ML_DEPS: "true"
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-modelforge}:${POSTGRES_PASSWORD:-modelforge}@postgres:5432/${POSTGRES_DB:-modelforge}
      LOCAL_STORAGE_ROOT: /data/storage
    volumes:
      - model_storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── AWS CPU worker (same image ECS runs) ────────────────────
  # Not needed for local AWS_MODE=mock (the backend runs conversions in-process).
  # Runs the ECS worker image locally against the real S3/SQS/RDS from backend/.env.aws:
  #   docker compose --profile aws up cpu-worker
  # TensorRT has no container: it runs natively on the GPU laptop (workers/tensorrt_worker.py).
  cpu-worker:
    profiles: ["aws"]
    build:
      context: .
      dockerfile: infrastructure/docker/cpu-worker.Dockerfile
    env_file: backend/.env.aws

volumes:
  pgdata:
  model_storage:
